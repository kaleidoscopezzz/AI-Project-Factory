<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="824" viewBox="0 0 1440 824" role="img" aria-labelledby="title desc">
  <title id="title">AI Project Factory — From Idea to Verified Software</title>
  <desc id="desc">A controlled software development workflow: natural language request, Planner and TaskPacket, Coder, independent Tester, independent read-only Reviewer, and approved stage delivery. Approved stages can use explicitly authorized local Git versioning. Automatic remote push and software release are outside this workflow.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0b1426"/><stop offset="1" stop-color="#070d19"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#137fa3" stop-opacity=".18"/><stop offset="1" stop-color="#137fa3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x2="0" y2="1">
      <stop stop-color="#15243a"/><stop offset="1" stop-color="#101b2d"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#56d9f3"/><stop offset=".65" stop-color="#6aabff"/><stop offset="1" stop-color="#a49bff"/>
    </linearGradient>
    <linearGradient id="review" x2="0" y2="1">
      <stop stop-color="#1c2440"/><stop offset="1" stop-color="#121c31"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1 8 5 2 9" fill="none" stroke="#65c7e9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Self-contained background and restrained ambient light. -->
  <rect width="1440" height="824" rx="28" fill="url(#background)"/>
  <ellipse cx="1150" cy="100" rx="440" ry="320" fill="url(#halo)"/>
  <rect x=".5" y=".5" width="1439" height="823" rx="28" fill="none" stroke="#26364d"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(56 51)">
      <path d="M0 8 14 0 28 8 28 24 14 32 0 24Z" fill="#143449" stroke="#59d8f0" stroke-width="1.5"/>
      <path d="m7 20 7-12 7 12M10 16h8" fill="none" stroke="#a2ecfa" stroke-width="1.8" stroke-linecap="round"/>
      <text x="44" y="23" fill="#b1c8e0" font-size="20" font-weight="600" letter-spacing="3">AI PROJECT FACTORY</text>
    </g>
    <text x="56" y="156" font-size="56" font-weight="700" letter-spacing="-1.6" fill="#f2f6ff">From Idea to <tspan fill="url(#accent)">Verified Software</tspan></text>
    <text x="58" y="198" fill="#afc0d5" font-size="23">A controlled pipeline. Independent validation. Traceable stage delivery.</text>

    <!-- The path follows 01 → 02 → 03, then 04 → 05 → 06 right to left. -->
    <g fill="none" stroke="#65c7e9" stroke-width="2" marker-end="url(#arrow)">
      <path d="M462 348h46"/><path d="M926 348h46"/>
      <path d="M1184 446v50"/>
      <path d="M978 604h-46"/><path d="M514 604h-46"/>
    </g>
    <g fill="#0d2336" stroke="#31627c">
      <circle cx="486" cy="348" r="3"/><circle cx="950" cy="348" r="3"/>
      <circle cx="1184" cy="474" r="3"/><circle cx="950" cy="604" r="3"/><circle cx="486" cy="604" r="3"/>
    </g>

    <!-- REQUEST -->
    <g transform="translate(56 252)">
      <rect width="400" height="194" rx="18" fill="url(#card)" stroke="#30425c"/>
      <rect x="26" y="0" width="74" height="2" rx="1" fill="#55d9ef"/>
      <text x="26" y="38" fill="#69d8ef" font-size="19" font-weight="600" letter-spacing="2">01 / REQUEST</text>
      <g transform="translate(332 26)" fill="none" stroke="#71d9ef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 2h34v24H14l-8 7v-7H0Z"/><path d="M8 10h18M8 17h12"/>
      </g>
      <text x="26" y="87" fill="#f1f6ff" font-size="31" font-weight="600">Describe your idea</text>
      <text x="26" y="126" fill="#b4c5db" font-size="22">Natural language requirements</text>
      <text x="26" y="160" fill="#829ab6" font-size="20">Define the software to build</text>
    </g>

    <!-- PLAN -->
    <g transform="translate(520 252)">
      <rect width="400" height="194" rx="18" fill="url(#card)" stroke="#30425c"/>
      <rect x="26" y="0" width="74" height="2" rx="1" fill="#55d9ef"/>
      <text x="26" y="38" fill="#69d8ef" font-size="19" font-weight="600" letter-spacing="2">02 / PLAN</text>
      <g transform="translate(336 24)" fill="none" stroke="#71d9ef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 0h22l8 8v28H0Z M22 0v8h8M7 16h16M7 23h16M7 30h10"/>
      </g>
      <text x="26" y="87" fill="#f1f6ff" font-size="31" font-weight="600">Planner → TaskPacket</text>
      <text x="26" y="126" fill="#b4c5db" font-size="22">Stage scope &amp; acceptance criteria</text>
      <text x="26" y="160" fill="#829ab6" font-size="20">An independent task for each Goal</text>
    </g>

    <!-- BUILD -->
    <g transform="translate(984 252)">
      <rect width="400" height="194" rx="18" fill="url(#card)" stroke="#30425c"/>
      <rect x="26" y="0" width="74" height="2" rx="1" fill="#6aabff"/>
      <text x="26" y="38" fill="#81b9ff" font-size="19" font-weight="600" letter-spacing="2">03 / BUILD</text>
      <g transform="translate(332 26)" fill="none" stroke="#81b9ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m10 6-9 10 9 10M26 6l9 10-9 10M22 1l-8 30"/>
      </g>
      <text x="26" y="87" fill="#f1f6ff" font-size="31" font-weight="600">Coder implementation</text>
      <text x="26" y="126" fill="#b4c5db" font-size="22">Real code. Incremental changes.</text>
      <text x="26" y="160" fill="#829ab6" font-size="20">Build on the approved prior stage</text>
    </g>

    <!-- VERIFY: flow returns across the lower row. -->
    <g transform="translate(984 508)">
      <rect width="400" height="194" rx="18" fill="url(#card)" stroke="#30425c"/>
      <rect x="26" y="0" width="74" height="2" rx="1" fill="#6aabff"/>
      <text x="26" y="38" fill="#81b9ff" font-size="19" font-weight="600" letter-spacing="2">04 / VERIFY</text>
      <g transform="translate(332 24)" fill="none" stroke="#81b9ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="35" height="28" rx="4"/><path d="M0 8h35M9 18l5 5 10-10M12 34h12M18 28v6"/>
      </g>
      <text x="26" y="87" fill="#f1f6ff" font-size="31" font-weight="600">Independent Tester</text>
      <text x="26" y="126" fill="#b4c5db" font-size="22">Build · Function · Runtime · Browser</text>
      <text x="26" y="160" fill="#829ab6" font-size="20">Verify criteria with real evidence</text>
    </g>

    <!-- REVIEW -->
    <g transform="translate(520 508)">
      <rect width="400" height="194" rx="18" fill="url(#review)" stroke="#56517d"/>
      <rect x="26" y="0" width="74" height="2" rx="1" fill="#a49bff"/>
      <text x="26" y="38" fill="#b6afff" font-size="19" font-weight="600" letter-spacing="2">05 / REVIEW</text>
      <g transform="translate(332 23)" fill="none" stroke="#b6afff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m18 0 16 6v13c0 9-8 14-16 18C10 33 2 28 2 19V6Z"/><path d="m10 18 6 6 11-12"/>
      </g>
      <text x="26" y="87" fill="#f1f6ff" font-size="31" font-weight="600">Independent Reviewer</text>
      <text x="26" y="126" fill="#b4c5db" font-size="22">Read-only code &amp; evidence review</text>
      <text x="26" y="160" fill="#9ba7c7" font-size="20">A separate quality decision</text>
    </g>

    <!-- DELIVER -->
    <g transform="translate(56 508)">
      <rect width="400" height="194" rx="18" fill="#102638" stroke="#397083"/>
      <rect x="26" y="0" width="74" height="2" rx="1" fill="#70e1de"/>
      <text x="26" y="38" fill="#83e3df" font-size="19" font-weight="600" letter-spacing="2">06 / DELIVER</text>
      <g transform="translate(334 24)" fill="none" stroke="#83e3df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 0h22l8 8v28H0Z M22 0v8h8M7 20l5 5 11-12"/>
      </g>
      <text x="26" y="87" fill="#f1f6ff" font-size="31" font-weight="600">Approved stage</text>
      <text x="26" y="126" fill="#bfd4e1" font-size="22">Verified software &amp; stage receipt</text>
      <text x="26" y="160" fill="#8fadbF" font-size="20">Traceable delivery for this Goal</text>
    </g>

    <!-- Optional versioning is distinct from the development approval path. -->
    <path d="M56 736h1328" stroke="#26374d"/>
    <g transform="translate(58 758)" fill="none" stroke="#7fbed3" stroke-width="1.8" stroke-linecap="round">
      <path d="M6 4v23M6 17c0-7 21-3 21-12"/><circle cx="6" cy="3" r="3"/><circle cx="6" cy="29" r="3"/><circle cx="27" cy="3" r="3"/>
    </g>
    <text x="105" y="780" fill="#bbcee1" font-size="22">Approved stages → <tspan fill="#79d4e8">Authorized local Git versioning</tspan></text>
    <text x="1384" y="780" text-anchor="end" fill="#8d9fb7" font-size="20">Explicit permission · No automatic push</text>
  </g>
</svg>
