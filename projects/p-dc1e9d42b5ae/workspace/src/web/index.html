<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阅间 · 离线图书馆</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body><header><div class="brand">阅间 <span>LIBRARY</span></div><span class="demo">离线演示</span></header><main><div class="intro"><p class="eyebrow">YOUR LOCAL COLLECTION</p><h1>每一本书，都有下一位读者</h1><p>虚构 DEMO 数据，无真实身份认证。借阅状态仅供展示。</p></div><section class="stats" aria-label="馆藏摘要"><div>馆藏总数<strong id="total">—</strong></div><div>可借图书<strong id="available">—</strong></div><div>已借出<strong id="borrowed">—</strong></div></section><section class="panel"><div class="section-heading"><h2>图书馆藏</h2><span>COLLECTION / 01</span></div><form id="search-form"><label for="search">搜索书名或作者</label><div class="search-row"><input id="search" placeholder="寻找下一本好书…"><button>搜索</button><button type="button" id="clear" class="secondary">清空</button></div></form><p id="list-message" role="status">正在加载…</p><div id="books"></div></section><section class="panel engineering"><div class="section-heading"><h2>工程验证</h2><span>B-001 / NOTE</span></div><p>备注持久化纵向样板 · 不改变借阅状态</p><p id="record"></p><label for="note">工程备注（1–120 个 Unicode 字符）</label><textarea id="note" rows="3"></textarea><div class="actions"><button id="save">保存备注</button><button id="reload" class="secondary">重新读取</button></div><p id="feedback" role="status"></p><small>更新时间以 Asia/Shanghai 显示；演示文件仅存于本机。</small></section><footer>阅间 · 离线本地演示 / Goal 0 工程基座</footer></main><dialog id="confirm"><h2>确认保存备注？</h2><p>仅更新 B-001 工程备注，借阅状态保持不变。</p><div class="actions"><button id="commit">确认保存</button><button id="cancel" class="secondary">取消</button></div></dialog></body></html>
