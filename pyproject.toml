[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-project-factory-cli"
version = "0.1.0"
description = "Windows CLI that reuses APF Codex Skills to generate software plans"
readme = "docs/CLI_USAGE.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
apf = "apf_cli.cli:main"

[tool.setuptools]
packages = ["apf_cli", "apf_cli.bundled_skills", "factory"]
package-dir = {"apf_cli.bundled_skills" = "skills"}

[tool.setuptools.package-data]
apf_cli = ["planner-contract.md"]
"apf_cli.bundled_skills" = ["**/*.md", "**/*.yaml"]
